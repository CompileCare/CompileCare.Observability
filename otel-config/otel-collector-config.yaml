receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

  otlphttp: # Send traces to Jaeger
    endpoint: "http://jaeger:4318/v1/traces"

  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus, debug]

    traces:
      receivers: [otlp]
      exporters: [otlphttp, debug]
