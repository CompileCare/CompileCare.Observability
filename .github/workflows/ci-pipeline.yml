name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet packages and verify embedded package readmes
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/heapcare-observability-pack"
          mkdir -p "$output"
          dotnet pack src/HeapCare.Observability/HeapCare.Observability.csproj \
            --configuration Release --no-restore -p:Version=1.0.2 -o "$output"
          dotnet pack src/HeapCare.Observability.AspNetCore/HeapCare.Observability.AspNetCore.csproj \
            --configuration Release --no-restore -p:Version=1.0.2 -o "$output"
          python - "$output" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          output = Path(sys.argv[1])
          expected = {
              "HeapCare.Observability.1.0.2.nupkg",
              "HeapCare.Observability.AspNetCore.1.0.2.nupkg",
          }
          actual = {item.name for item in output.glob("*.nupkg")}
          assert actual == expected, f"Unexpected package set: {actual}"

          for package_name in sorted(expected):
              package_path = output / package_name
              with zipfile.ZipFile(package_path) as archive:
                  names = set(archive.namelist())
                  assert "Readme.md" in names, f"{package_name} does not embed Readme.md"
                  nuspec_name = next(name for name in names if name.endswith(".nuspec"))
                  nuspec = ET.fromstring(archive.read(nuspec_name))
                  readme_values = [
                      element.text
                      for element in nuspec.iter()
                      if element.tag.rsplit("}", 1)[-1] == "readme"
                  ]
                  assert readme_values == ["Readme.md"], (
                      f"{package_name} has incorrect nuspec readme metadata: {readme_values}"
                  )
                  print(f"Verified {package_name}: Readme.md is embedded and declared.")
          PY

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/**/*.xml'

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check code format
        run: dotnet format --verify-no-changes

  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [build, test, code-quality]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Determine version suffix
        id: version
        shell: bash
        run: |
          BASE_VERSION="1.0.2"
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == "develop" ]]; then
            echo "VERSION=$BASE_VERSION-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == bugfix/* ]]; then
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g')
            echo "VERSION=$BASE_VERSION-$SAFE_BRANCH.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Pack NuGet
        run: dotnet pack --configuration Release -p:Version=${{ env.VERSION }} -o ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
