name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/**/*.xml'

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check code format
        run: dotnet format --verify-no-changes

  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [build, test, code-quality]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Determine version suffix
        id: version
        shell: bash
        run: |
          BASE_VERSION="1.0.1"
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == "develop" ]]; then
            echo "VERSION=$BASE_VERSION-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == bugfix/* ]]; then
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g')
            echo "VERSION=$BASE_VERSION-$SAFE_BRANCH.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Pack NuGet
        run: dotnet pack --configuration Release -p:Version=${{ env.VERSION }} -o ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
