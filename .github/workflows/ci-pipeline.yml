name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build solution
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Run tests with coverage
      - name: Run Tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      # Upload coverage report (optional)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/**/*.xml'
          
      # SonarQube Analysis (optional, requires SonarQube setup)
      # - name: SonarQube Scan
      #   uses: sonarsource/sonarcloud-github-action@master
      #   with:
      #     args: >
      #       -Dsonar.projectKey=CompileCare
      #       -Dsonar.organization=your_org
      #       -Dsonar.host.url=https://sonarcloud.io
      #       -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Enforce code formatting (fail if not formatted)
      - name: Check code format
        run: dotnet format --verify-no-changes

      - name: Read current version
        id: get_version
        run: |
          VERSION=$(cat version.txt)
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Bump version
        id: bump
        run: |
          VERSION=${{ env.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            # bump minor on develop merges
            MINOR=$((MINOR+1))
            PATCH=0
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            # bump patch on main merges (hotfix/release)
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo $NEW_VERSION > version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Bump version to ${{ env.new_version }}" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Create Git Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag v${{ env.new_version }}
          git push origin v${{ env.new_version }}
